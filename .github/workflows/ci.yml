name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --group dev --group lint

      - name: Lint with ruff
        run: |
          uv run ruff check src/ tests/
          uv run ruff format --check src/ tests/

      - name: Type check with mypy
        run: |
          uv run mypy src/
          # Separate invocation: tests/ has no __init__.py, so passing both at once
          # makes mypy resolve two modules to the same name.
          uv run mypy tests/typing_examples.py

      # The version monitors bump the pin files unattended and auto-merge, but only ever touch
      # the pin and the matrix — so the prose drifts silently on every bump. This catches it.
      - name: Check the docs match the SurrealDB pins
        run: uv run python scripts/sync_surrealdb_pins.py

  tests:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
        # The two supported server lines. 3.1.x was dropped in v0.14.0 in favour of 3.2.x —
        # 3.2 is its own line, not a drop-in for 3.1 (SurrealDB 3.2.0 regressed uncorrelated
        # sub-SELECTs combining ORDER BY and LIMIT, EulogySnowfall/SurrealDB-ORM#147), so it
        # is tested directly rather than assumed equivalent.
        surrealdb-version: ['v2.6.5', 'v3.2.4']

    steps:
      - name: Start SurrealDB ${{ matrix.surrealdb-version }}
        run: |
          docker run -d \
            --name surreal \
            -p 8000:8000 \
            surrealdb/surrealdb:${{ matrix.surrealdb-version }} \
            start --user root --pass root

          echo "Waiting for SurrealDB to be healthy..."
          for i in {1..30}; do
            # /health answers 200 with an empty body, so the status code is the whole
            # signal. Grepping the body for "OK" never matched, so this loop ran its
            # full budget on every job and then fell through to the tests regardless.
            if curl -sf http://localhost:8000/health >/dev/null; then
              echo "SurrealDB is up! (attempt ${i})"
              exit 0
            fi
            sleep 2
          done
          echo "SurrealDB did not become healthy" >&2
          docker logs surreal >&2 || true
          exit 1

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run all tests
        env:
          SURREALDB_HOST: localhost
          SURREALDB_PORT: 8000
        run: uv run pytest tests/ -v --cov=src.surreal_orm_lite --cov-report=xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.14'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

  ci-success:
    name: CI Success
    needs: [lint, tests]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "Lint failed"
            exit 1
          fi
          if [ "${{ needs.tests.result }}" != "success" ]; then
            echo "Tests failed"
            exit 1
          fi
          echo "All checks passed!"

  auto-tag:
    name: Auto Tag
    needs: [ci-success]
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, 'chore(release): bump version to ')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.PAT_TOKEN }}

      - name: Create and push tag
        run: |
          VERSION=$(grep -E '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          TAG="v${VERSION}"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

          echo "Created and pushed tag: $TAG"
