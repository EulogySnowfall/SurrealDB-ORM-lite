# Auto-merge Dependabot PRs after successful tests
# Bumps the patch (3rd) digit for security updates: x.y.z -> x.y.(z+1)
# Versioning: X=LTS/breaking, Y=features, Z=security patches

name: Dependabot Auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  SURREALDB_HOST: localhost
  SURREALDB_PORT: 8000

jobs:
  # =============================================================================
  # Check if this is a Dependabot PR
  # =============================================================================
  check-dependabot:
    name: Check Dependabot PR
    runs-on: ubuntu-latest
    outputs:
      is-dependabot: ${{ steps.check.outputs.is-dependabot }}
    steps:
      - name: Check if Dependabot PR
        id: check
        run: |
          IS_DEPENDABOT="false"
          if [[ "${{ github.actor }}" == "dependabot[bot]" ]]; then
            IS_DEPENDABOT="true"
          fi
          echo "is-dependabot=$IS_DEPENDABOT" >> $GITHUB_OUTPUT

  # =============================================================================
  # Run full test suite for Dependabot PRs
  # =============================================================================
  test-dependabot:
    name: Test Dependabot Changes
    needs: check-dependabot
    if: needs.check-dependabot.outputs.is-dependabot == 'true'
    runs-on: ubuntu-latest
    outputs:
      tests-passed: ${{ steps.test-result.outputs.passed }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --group dev --group lint

      - name: Run linting
        run: |
          uv run ruff format --check src/
          uv run ruff check src/

      - name: Run type checking
        run: uv run mypy src/

      - name: Start SurrealDB
        run: |
          SURREALDB_VERSION=$(cat .surrealdb-version | tr -d '[:space:]')
          docker run -d \
            --name surrealdb-test \
            -p 8000:8000 \
            "surrealdb/surrealdb:v${SURREALDB_VERSION}" \
            start --user root --pass root

          echo "Waiting for SurrealDB to be healthy..."
          for i in {1..15}; do
            if curl -s http://localhost:8000/health | grep -q "OK"; then
              echo "SurrealDB is up!"
              break
            fi
            echo "SurrealDB not up yet. Retrying..."
            sleep 2
          done

      - name: Run all tests
        run: |
          uv run pytest tests/ -v \
            --cov=src.surreal_orm_lite \
            --cov-branch \
            --cov-report=xml

      - name: Stop SurrealDB
        if: always()
        run: docker stop surrealdb-test && docker rm surrealdb-test || true

      - name: Set test result
        id: test-result
        if: success()
        run: echo "passed=true" >> $GITHUB_OUTPUT

  # =============================================================================
  # Auto-merge and create version bump PR
  # =============================================================================
  automerge:
    name: Auto-merge & Version Bump PR
    needs: [check-dependabot, test-dependabot]
    if: |
      needs.check-dependabot.outputs.is-dependabot == 'true' &&
      needs.test-dependabot.outputs.tests-passed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.PAT_TOKEN }}

      - name: Get Dependabot metadata
        id: dependabot-metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate next security patch version
        id: version
        run: |
          CURRENT_VERSION=$(grep -E '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          echo "Current version: $CURRENT_VERSION"

          MAJOR=$(echo "$CURRENT_VERSION" | cut -d. -f1)
          MINOR=$(echo "$CURRENT_VERSION" | cut -d. -f2)
          PATCH=$(echo "$CURRENT_VERSION" | cut -d. -f3)

          NEXT_PATCH=$((PATCH + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}"
          NEW_TAG="v${NEW_VERSION}"

          echo "New version: $NEW_VERSION"
          echo "New tag: $NEW_TAG"

          echo "current-version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "new-tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "new-version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Enable auto-merge
        run: gh pr merge --auto --squash "${{ github.event.pull_request.number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for merge
        id: wait-merge
        run: |
          MAX_ATTEMPTS=30
          ATTEMPT=0

          while [[ $ATTEMPT -lt $MAX_ATTEMPTS ]]; do
            STATE=$(gh pr view "${{ github.event.pull_request.number }}" --json state -q '.state')

            if [[ "$STATE" == "MERGED" ]]; then
              echo "PR merged successfully"
              echo "merged=true" >> $GITHUB_OUTPUT
              exit 0
            fi

            echo "Waiting for PR to merge... (attempt $((ATTEMPT + 1))/$MAX_ATTEMPTS)"
            sleep 10
            ATTEMPT=$((ATTEMPT + 1))
          done

          echo "PR did not merge in time"
          echo "merged=false" >> $GITHUB_OUTPUT
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout main after merge
        if: steps.wait-merge.outputs.merged == 'true'
        run: |
          git fetch origin main
          git checkout main
          git pull origin main

      - name: Install uv
        if: steps.wait-merge.outputs.merged == 'true'
        uses: astral-sh/setup-uv@v7

      - name: Configure Git
        if: steps.wait-merge.outputs.merged == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create version bump PR
        if: steps.wait-merge.outputs.merged == 'true'
        run: |
          NEW_VERSION="${{ steps.version.outputs.new-version }}"
          NEW_TAG="${{ steps.version.outputs.new-tag }}"
          BRANCH="chore/release-${NEW_TAG}"
          CURRENT_VERSION="${{ steps.version.outputs.current-version }}"

          echo "Creating version bump PR: $CURRENT_VERSION -> $NEW_VERSION"

          git checkout -b "$BRANCH"

          # Update pyproject.toml (source of truth)
          sed -i "s/^version = \".*\"/version = \"$NEW_VERSION\"/" pyproject.toml

          # Sync all other version references
          python scripts/sync_version.py --fix

          # Regenerate lockfile
          uv lock

          git add pyproject.toml src/surreal_orm_lite/__init__.py tests/test_v050.py uv.lock
          git commit -m "chore(release): bump version to $NEW_VERSION"
          git push origin "$BRANCH"

          gh pr create \
            --title "chore(release): bump version to $NEW_VERSION" \
            --body "## Version Bump

          Automated version bump after merging dependabot PR #${{ github.event.pull_request.number }}.

          ### Updated Dependencies
          - **Package:** ${{ steps.dependabot-metadata.outputs.dependency-names }}
          - **Update type:** ${{ steps.dependabot-metadata.outputs.update-type }}

          ---
          *This PR was automatically created by the Dependabot auto-merge workflow.*" \
            --base main \
            --head "$BRANCH"

          gh pr merge --auto --squash "$BRANCH"
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
