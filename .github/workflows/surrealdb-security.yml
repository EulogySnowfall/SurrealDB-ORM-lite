# SurrealDB 2.X Version Monitor — the legacy supported line.
#
# Pinned in .surrealdb-version2x. The primary line (3.x, pinned in .surrealdb-version) is
# watched by surrealdb-3x-monitor.yml; keep the two pins and the two schedules separate, or
# this monitor compares a 3.y.z pin against the latest 2.x and reports a phantom update —
# and a downgrade — every single day (#135).
#
# The flow itself lives in surrealdb-monitor.yml.

name: SurrealDB Version Monitor

on:
  schedule:
    # Daily at 7:00 AM Montreal time (UTC-5 -> 12:00 UTC)
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      surrealdb_version:
        description: 'SurrealDB 2.X version to test (e.g. 2.6.1, leave empty for latest v2.x)'
        required: false
        type: string
      force_update:
        description: 'Force update even if version matches'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  monitor:
    name: SurrealDB 2.X
    uses: ./.github/workflows/surrealdb-monitor.yml
    secrets: inherit
    permissions:
      contents: write
      issues: write
      pull-requests: write
    with:
      line: '2'
      pin-file: .surrealdb-version2x
      # The 2.x line still ships proper GitHub releases, so the release notes are available
      # and a security patch can be detected from them.
      version-source: github-releases
      requested-version: ${{ inputs.surrealdb_version || '' }}
      force-update: ${{ inputs.force_update || false }}
